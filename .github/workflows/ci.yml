name: CI - Tests & Lint

# This workflow runs on every push to main/develop branches
# - Critical tests: Always run (no database required)
# - Integration tests: Only run if Supabase credentials are configured
# - E2E tests: Only run if Supabase credentials are configured
# - Security checks: Always run
# Last updated: 2026-01-27

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "Linter not configured - skipping"
        continue-on-error: true

      - name: Type check (TSC)
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Run critical tests
        run: npm test -- tests/critical
        continue-on-error: false

      # v3.74.740 — integration and E2E now gate on TEST_* credentials, not the
      # application's.
      #
      # These suites create and delete users, companies, invoices, payments and
      # journal entries. They previously read NEXT_PUBLIC_SUPABASE_URL and
      # SUPABASE_SERVICE_ROLE_KEY — the same secrets this workflow passes to the
      # app. Adding those secrets to "turn the tests on" would have started
      # writing test companies into the live accounting database on every push.
      #
      # They also ran with continue-on-error: true, so failures were invisible.
      # Running something whose result you ignore is worse than not running it:
      # it buys a feeling of coverage and pays nothing for it. Now they either
      # run for real and block, or they are honestly reported as not wired up.
      - name: Check for a dedicated test database
        id: check-credentials
        run: |
          if [ -n "${{ secrets.TEST_SUPABASE_URL }}" ] && [ -n "${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "credentials_available=true" >> $GITHUB_OUTPUT
          else
            echo "credentials_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Run API integration tests
        if: steps.check-credentials.outputs.credentials_available == 'true'
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm test -- tests/integration

      - name: Run E2E tests
        if: steps.check-credentials.outputs.credentials_available == 'true'
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm test -- tests/e2e

      - name: Integration and E2E are NOT running
        if: steps.check-credentials.outputs.credentials_available == 'false'
        run: |
          echo "::warning title=Integration and E2E tests are not running::TEST_SUPABASE_URL and TEST_SUPABASE_SERVICE_ROLE_KEY are not set."
          echo ""
          echo "58 test cases across tests/integration and tests/e2e are NOT executing."
          echo "The only suite guarding this build is tests/critical."
          echo ""
          echo "To enable them, create a SEPARATE Supabase project for tests and add:"
          echo "  TEST_SUPABASE_URL"
          echo "  TEST_SUPABASE_SERVICE_ROLE_KEY"
          echo ""
          echo "Do NOT point these at production. The suites create and delete"
          echo "users, companies, invoices and journal entries, and test-setup.ts"
          echo "will refuse the production project ref outright."

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # v3.74.736 — replaces a hand-written list of three files.
      #
      # The old step checked that requireOwnerOrAdmin or secureApiRequest was
      # CALLED in fix-inventory, fix-sent-invoice-journals and repair-invoice.
      # Two problems, both proven in v3.74.733:
      #
      #   1. Three files out of 112 that use the service-role key. Nothing
      #      covered the rest, and nobody grew the list.
      #   2. It checked that the question was asked, not that the answer was
      #      used. fix-negative-payments DID call requireOwnerOrAdmin, threw
      #      away its companyId, and rewrote payments for every tenant. It
      #      would have passed this step.
      #
      # The script below covers all 112 and asks whether the company the route
      # acts on comes from somewhere the caller cannot choose.
      - name: Service-role routes must scope to the caller's company
        run: node scripts/check-service-role-scoping.js

      # v3.74.755 — supabase-js does not throw on a failed write; it returns
      # { error }. Four writes that discarded that result were found broken in
      # a single day, each having reported success for as long as it existed:
      # the customer branch trigger, the nightly integrity cron, the FX
      # revaluation reminder, and a retired repair tool. This stops the count
      # from growing.
      - name: Database writes must not discard their result
        run: node scripts/check-unchecked-writes.js

      - name: Check for NextResponse.json usage in critical endpoints
        run: |
          # Critical endpoints should NOT use NextResponse.json for errors
          if grep -r "NextResponse.json.*error" app/api/fix-inventory/route.ts; then
            echo "❌ fix-inventory still uses NextResponse.json for errors"
            exit 1
          fi
          if grep -r "NextResponse.json.*error" app/api/fix-sent-invoice-journals/route.ts; then
            echo "❌ fix-sent-invoice-journals still uses NextResponse.json for errors"
            exit 1
          fi
          echo "✅ Error handling checks passed"

      - name: Check for NextResponse.json usage in critical endpoints
        run: |
          # Critical endpoints should NOT use NextResponse.json for errors
          if grep -r "NextResponse.json.*error" app/api/fix-inventory/route.ts; then
            echo "❌ fix-inventory still uses NextResponse.json for errors"
            exit 1
          fi
          if grep -r "NextResponse.json.*error" app/api/fix-sent-invoice-journals/route.ts; then
            echo "❌ fix-sent-invoice-journals still uses NextResponse.json for errors"
            exit 1
          fi
          echo "✅ Error handling checks passed"

  ai-governance-audit:
    name: AI Governance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # v3.74.828 — يسبق التدقيق نفسه: لو استُدعى سكربت غير مرفوع إلى git،
      # يفشل التدقيق بـ MODULE_NOT_FOUND ويُتخطى النشر — وهو بالضبط ما حدث
      # مع ai-governance-audit.js. هذه الخطوة تسمّى الملف الناقص صراحةً بدل
      # تركك تقرأ أثر مكدس Node.
      - name: Verify referenced scripts are committed
        run: npm run check:scripts-tracked

      # v3.74.831 — تشخيص واضح بدل جدار npm ci: لو تفاوت القفل عن
      # package.json تقول الخطوة أى حزمة ناقصة وماذا يُفعل.
      - name: Verify the lockfile matches package.json
        run: npm run check:lockfile

      # v3.74.869 — لا وحدةَ غير موصولة تكتب فى الدفاتر. فاللغم لا يُبلَّغ
      # عنه من أى حارسٍ آخر: لا يُنفَّذ فلا يفشل، ثم يُوصَل بعد شهور فينفجر.
      - name: Check for ledger landmines
        run: npm run check:ledger-landmines

      - name: Prove the ledger-landmine guard refuses
        run: npm run check:ledger-landmines:selftest

      # v3.75.80 — 🔴 **وفخٌّ بلا قاعدةٍ لا يقولُ «نجحتُ» ولا «سقطتُ» بل «لم أَقِسْ».**
      # كانت هذه الوظيفةُ **حمراءَ فى كلِّ قيدٍ منذ شهور** بسبب سطرٍ واحدٍ فى فخٍّ
      # ذاتىٍّ واحد: `X PRODUCTION_SUPABASE_DB_URL is not set`. ولأن وظيفة النشر
      # مشروطةٌ بها (needs:) صارت مُتخطّاةً دائماً — فنصفُ آلةِ الحراسةِ كان مُطفأً
      # ولم يقلْ ذلك أحد. والعطبُ كان انقسامَ الحكم: تسعةُ فخاخٍ تتخطّى بصفر
      # وتسعةٌ تسقط بواحد **على الحالةِ الواحدة**. فصار الحكمُ فى بيتٍ واحد.
      - name: Every self-test trap takes its verdict from one home
        run: npm run check:selftest-homes

      - name: Prove the one-home guard refuses
        run: npm run check:selftest-homes:selftest

      # v3.75.81 — 🔴 **وفخٌّ لا يُنادى ليس فخّاً.** عدَّت v3.75.80 الفخاخَ ولم
      # تسألْ من يُشغِّلُها، فقِيسَ بعدَها بيومٍ فإذا **١٧ من ٢٦ لا يُناديها شىء**
      # — وثلاثةٌ منها ساقطةٌ فعلاً، أحدُها **لم يكنْ أخضرَ قطُّ** منذ v3.75.4.
      # وهنا لا رابطَ قاعدةٍ أصلاً، فثمانيةُ فخاخٍ تجرى حقّاً وثمانيةَ عشرَ تقولُ
      # «لم أَقِسْ» بلا ادّعاءِ نجاح. والقياسُ الكاملُ مكانُه بوّابةُ الدفعِ على
      # جهازِ صاحبِ المشروع، حيثُ القاعدةُ الحيّةُ موجودة.
      - name: Call every standalone self-test trap
        run: npm run check:traps

      - name: Prove the trap-caller separates the three verdicts
        run: npm run check:traps:selftest

      # v3.75.82 — 🔴 **قفلٌ يُفتَحُ باسمٍ يُرسلُه الطارقُ ليس قفلاً.** كانت
      # `unlock_accounting_period` بصلاحيّاتٍ كاملةٍ وممنوحةً لكلِّ مستخدِمٍ مسجَّل،
      # وتقرِّرُ الإذنَ من وسيطٍ يكتبُه المُنادى، و`NULL <> 'owner'` تُساوى NULL فلا
      # يعملُ فرعُ الرفض — فيمرُّ غيرُ العضوِ إلى الفتح. والقياسُ الحقيقىُّ يحتاجُ
      # القاعدةَ الحيّة، فهنا يُثبَتُ الحكمُ وحدَه ويُقاسُ الأثرُ فى بوّابةِ الدفع.
      - name: Prove the period-lock guard refuses
        run: npm run check:period-lock:selftest

      # v3.75.83 — 🔴 **بابٌ لا يُفتَحُ أبداً ليس باباً.** وعدَت v3.75.82 بمسحِ كلِّ
      # نداءٍ فى الشيفرةِ على التواقيعِ المنشورة، فقِيسَ: **٤٩٤ نداءً · ٨٨ منها لا
      # يجدُ باباً** — ٨٢ تُنادى اسماً لا وجودَ له إطلاقاً. وثلاثةُ مواضعَ منها كانت
      # **تُعلنُ نجاحاً على فشل**: معاينةُ إقفالِ الفترةِ تعرضُ صفراً، وحسابُ العمولاتِ
      # يكتبُ صفراً فى جدولِ مالٍ ويعودُ بنجاح، وشاشةُ قواعدِ الأوامرِ تقولُ «تمّ» ولم
      # يُنشَأْ شىء. والقياسُ الكاملُ يحتاجُ القاعدةَ الحيّة، فهنا يُثبَتُ الحكمُ وحدَه.
      - name: Prove the rpc-door guard refuses
        run: npm run check:rpc-doors:selftest

      # v3.75.84 — 🔴 **ولا يُسجَّلُ مالٌ بعملةٍ لم تُترجَم.** سُئل: أمشروعُنا مُجهَّزٌ
      # للاستيرادِ من الخارج؟ فقِيسَ: أمرُ الشراءِ يقبلُ عملةً أجنبيّةً فعلاً،
      # **وفاتورةُ الشراءِ التى تليه لا تعرفُ العملةَ إطلاقاً**، وبيتُ التكلفةِ
      # المُنزَلةِ يقرأُ المبالغَ بلا ضربٍ فى سعرِ صرف. فلو دخلت فاتورةٌ بالدولارِ
      # لدخلَ الرقمُ الأجنبىُّ إلى المخزونِ كأنّه محلّىٌّ **ولم يصرخْ أحد**. فصارَ
      # الخطأُ الصامتُ مستحيلاً: مستندٌ بعملةٍ أجنبيّةٍ بلا سعرٍ ومبلغٍ مُترجَمٍ
      # مُطابقٍ يُرفَض. والقياسُ الكاملُ يحتاجُ القاعدةَ الحيّة، فهنا يُثبَتُ الحكم.
      - name: Prove the foreign-money guard refuses
        run: npm run check:fx-translated:selftest

      # v3.74.867 — اللقطة تطابق القاعدة الحيّة. الحارس القائم
      # (check-schema-snapshot-fresh) يعترف بأنه لا يرى ما أُضيف للقاعدة
      # وغاب عن الملف — وهو الاتجاه الذى فقدنا فيه أربعة جداول كاملة.
      - name: Check the schema snapshot matches the database
        run: npm run check:schema-snapshot-db

      # ويجب أن يُرى وهو يرفض، وأن يُسمّى ما زُرع له.
      - name: Prove the snapshot/database guard refuses
        run: npm run check:schema-snapshot-db:selftest

      # v3.74.830 — لا كتابة **جديدة** لعمود لا وجود له فى جدوله. الديون
      # الموروثة على خط أساس (56)، وأى واحدة جديدة تكسر البناء.
      - name: Check for phantom column writes
        run: npm run check:phantom-columns

      # v3.74.845 — ولا **قراءة** جديدة لعمود لا وجود له. حارس ٨٣٠ يفحص
      # الكتابة وحدها وفى مسارات الـAPI وحدها، فمرّت شاشة تقرأ
      # `employees.name` (الصحيح `full_name`) وقائمة الموظفين تخرج فارغة
      # دائماً **بلا رسالة خطأ**. الفشل الصامت أخطر من الصاخب: لا يُفرَّق
      # بالنظر بين «فارغ لأنه لا يوجد» و«فارغ لأن العمود وهمى».
      - name: Check for phantom column reads
        run: npm run check:phantom-selects

      # v3.74.847 — ولا حساب يُطلب برقم لا وجود له فى أى دليل. صرف المرتبات
      # كان يبحث عن الكود 6110 وهو غير موجود فى أى شركة (الصحيح 5210)، فلم
      # يعمل صرف المرتبات ولا مرة، فى أى شركة. والرسالة تبدو للمستخدم نقصاً
      # فى إعداد شركته لا عطباً فى البرنامج — فلا يُبلَّغ عنها أصلاً.
      - name: Check hard-coded account codes exist
        run: npm run check:account-codes

      # v3.74.851 — ولا حدث يصل نفس الجمهور مرتين. (owner/admin/general_manager)
      # جمهور واحد فى NotificationCenter: كلٌّ يرى إشعارات الآخرين، فإرسال
      # بدور لكلٍّ منها = ثلاث نسخ فى جرس المالك. يقرأ الفحص **القاعدة** لا
      # الكود: نسخته الساكنة أعلنت صفراً بينما فى الإنتاج ١٥ فاتورة مكرَّرة،
      # لأن نصف المشروع يُرسل داخل حلقة بمتغيّر لا يراه بحث نصّى.
      - name: Check duplicate-audience notifications
        run: npm run check:dup-notify

      # v3.74.852 — ولا نوع حركة يُغيّر المخزون بلا عمود فى تقرير حالة المخزون.
      # ثالث تكرار: العهدة (714)، ثم خليتا الإجمالى الناقصتان (716)، ثم التصنيع.
      # صفٌّ يقول «مشتريات ٣ · مبيعات ٠ · مرتجعات ٠ · هالك ٠ · متاح ٠» حسابٌ
      # لا يُغلَق، ويُفقد الثقة فى التقرير كله ولو كان الرصيد صحيحاً.
      - name: Check inventory movement coverage
        run: npm run check:movement-coverage

      # v3.74.853 — ولا منتج تام يدخل المخزون بتكلفة مواده وحدها. أمر الإنتاج
      # يُثبّت نسخة المسار عند إنشائه، فتفعيل نسخة مُصحَّحة لاحقاً لا يُصلح
      # أمراً قائماً — ودخل MPO-202607-000030 بـ٦٠ بدل ١١٨٫٥٠. والأثر يظهر
      # عند **البيع** لا عند الإنتاج: ربح أعلى من حقيقته.
      - name: Check finished-goods conversion cost
        run: npm run check:fg-conversion

      # v3.74.856 — 🔴 ولا عميل يبقى بحساب مؤكَّد بلا شركة. الشركة لا تُنشأ
      # عند التسجيل بل عند إدخال كود التأكيد؛ وأى تعثّر هناك كان يترك العميل
      # أمام أول شاشة بلا مخرج — **ولا يعلم أحد**، لأن العطب لا يُبلَّغ عنه.
      # هذا الفحص يقيس الأثر مباشرةً من القاعدة.
      - name: Check for users stranded without a company
        run: npm run check:stranded-users

      # v3.74.834 — ملف الترحيل ادّعاء بأن هذا ما فى القاعدة؛ فليُختبر الادّعاء.
      # انحرف الاتجاهان فى ٢٦ يوليو: ملف مايو لم تصل كائناته للإنتاج (فتتبّع
      # صرف الخامات مُجمَّد على صفر شهوراً)، ومسودة قديمة رُفعت مكان الإصلاح
      # المطبَّق فعلاً (ولو طُبِّقت لرفضت كل استلام منتج). بلا مفتاح القاعدة
      # يتخطّى الفحص بتنبيه — وفى سكربت النشر يُلزَم بـ --require-db.
      - name: Verify changed migrations match the live database
        run: npm run check:migration-db
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

      # 🔴 v3.74.836 — أول شاشة يراها عميل يدفع. سقطت على عميل حقيقى برسالة
      # «فشل في إنشاء الشركة»، ولم يكشفها شىء: بمفتاح الخدمة ينجح الإدراج
      # دائماً لأن auth.uid() فارغة. فيُختبر المسار بهوية مستخدم مسجَّل داخل
      # معاملة تُلغى. بلا مفتاح القاعدة يتخطّى الفحص بتنبيه.
      - name: Smoke-test the signup path (new company creation)
        run: npm run check:signup || echo "::warning::signup smoke test skipped or failed - check the log"
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

      # v3.74.840 — سجل التدقيق شاهد لا قاضٍ. فحصُ تصريح داخله أسقط إنشاء شركة
      # على عميل حقيقى، و`WHEN OTHERS` لا يلتقط 57014 فلم تنفع شبكة الأمان.
      # وثلاث من خمس دوال تدقيق كانت بلا أى معالج (العملاء · المنتجات ·
      # الفواتير · فواتير المشتريات · أوامر الشراء).
      - name: Verify the audit trail cannot abort a business operation
        run: npm run check:audit-safe
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

      # 🔒 v3.74.844 — `CREATE FUNCTION` يمنح التنفيذ لـ PUBLIC تلقائياً وPUBLIC
      # تشمل الزائر، والمنح الصريح لا يُلغى الموروث. عشر دوال من ٨٤١/٨٤٣ كانت
      # مفتوحة بهذا. يُطابق فحص لوحة التحكم `ic_anon_reachable_readers` حتى
      # يسقط البناء بدل انتظار ملاحظته على شاشة.
      - name: No company-reading function open to anonymous callers
        run: npm run check:anon-functions
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

      # 🔒 v3.74.857 — الحارس السابق يفحص الدوال؛ وكانت الفجوة فى **الجداول**.
      # سياسات سُمّيت `*_service_role` بلا `TO service_role` تسرى على PUBLIC —
      # أى على الزائر المجهول. ١٢ جدولاً كانت مكشوفة، منها ١٧٤ ألف صف سجلات
      # قابلة للحذف، وبريد كل عميل سجَّل، وجداول الاشتراكات والفوترة.
      # حارسٌ على بابٍ لا يحمى باباً آخر — تكرَّر فى ٨٣٣ و٨٤٥ و٨٥١ و٨٥٣.
      - name: No table left open to anonymous visitors
        run: npm run check:anon-tables
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

      # 🔴 v3.74.858 — المتصفح لا يقرر الأعمدة. حقل عرضٍ واحد (`branch_name`)
      # أُضيف فى ٦٣٧ لشاشة الأصناف أسقط **كل** تعديل صنف من تلك الشاشة، بخطأ
      # ٤٠٠ لا يبلغ سجلات القاعدة أصلاً — فبقى صامتاً حتى صادفه المالك بنفسه.
      # ولا يحتاج هذا الفحص قاعدة بيانات: يقرأ المصدر وحده.
      - name: No route writes the request body straight into the database
        run: npm run check:raw-body-writes

      - name: Prove the raw-body guard refuses
        run: npm run check:raw-body-writes:selftest

      # 🔴 v3.74.859 — ستة جداول كانت بلا سجل تدقيق إطلاقاً (الصلاحيات،
      # الفترات المحاسبية، المرتبات، الضرائب) لأن الدالة تقرأ `NEW.branch_id`
      # داخل تعبير CASE، وPL/pgSQL يُخطِّطه كاملاً مهما كان الشرط.
      # الفحص تجريبى لا صرفى: يُحدِّث صفاً بلا تغيير داخل معاملة تُلغى،
      # ويشترط ظهور قيد تدقيق. الفحص الصرفى أعطى ٢١ إنذاراً كاذباً.
      - name: Every audited table actually records
        run: npm run check:audit-records
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

      # 🔴 v3.74.860 — ترابط الدفاتر يُقاس مرةً واحدة صحيحاً فلا يُعاد اجتهاده.
      # حسبتُ فجوة المخزون يدوياً مرّتين فى جلسة واحدة وأخطأتُ المرّتين بنفس
      # الخطأ (إغفال `is_deleted`)، فظهر نفس الرقم الكاذب ٢٢.٦٩. وأول تشغيلٍ
      # صحيح كشف ٧٣٣ سطر قيدٍ بلا قيدٍ أب ولا حساب — أُرشفت بقرار المالك.
      - name: Ledger integrity holds
        run: npm run check:ledger
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

      # 🔴 v3.74.861 — تكلفة واقعة الشراء كانت تُحسب مرّتين: الدفاتر وFIFO
      # بالتكلفة المحمَّلة، وسجل الحركة بالسعر الخام من TypeScript الذى لا
      # يجلب `discount_percent` أصلاً. كل فاتورة بخصم ⇒ فارق. الآن مُشغِّل
      # BEFORE INSERT يفرض السلطة الواحدة، وهذا الفحص يمنع عودة الانقسام.
      - name: Purchase movement cost matches the ledger
        run: npm run check:movement-cost
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

      # 🔴 v3.74.862 — حركات العهدة كانت تُسجَّل بلا تكلفة وبلا رابطٍ لقيدها،
      # رغم أن الدالة تحسب القيمة وتستعملها فى القيد وتحتفظ بمعرّفه. المعلومة
      # كانت فى اليد ولم تُسجَّل — وهذا أسوأ من غيابها.
      - name: Custody movements carry cost and journal link
        run: npm run check:custody-movements
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

      # 🔴 v3.74.863 — أُعيدت كتابة هذا الحارس: كان يُبلّغ عن ٥١ كتابة، تسعةُ
      # أعشارها إنذاراتٌ كاذبة (نافذة تتخطّى الجُملة · مفاتيح jsonb متداخلة ·
      # لقطة مخطَّطٍ متأخرة). صار يقرأ **القاعدة الحيّة** ويوازن الأقواس.
      - name: No write targets a column that does not exist
        run: npm run check:phantom-columns
        env:
          PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}

      - name: Run AI governance audit
        run: npm run governance:audit:ci

      - name: Upload governance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-governance-reports
          path: knowledge/governance/

# ═══════════════════════════════════════════════════════════════════════════
# v3.75.80 — **ولا زينةَ على بابٍ لا يُفتَح**: أين يُنشَرُ هذا المشروعُ فعلاً؟
# ═══════════════════════════════════════════════════════════════════════════
#
# كان هنا وظيفةٌ اسمُها `Deploy to Vercel (production)` — **ولم تنشرْ قطّ**.
# كانت مشروطةً بـ`needs: [test, security-check, ai-governance-audit]`،
# والأخيرةُ حمراءُ فى كلِّ قيدٍ منذ شهور، فكانت الوظيفةُ **مُتخطّاةً دائماً**.
# ومع ذلك كان المشروعُ يُنشَرُ فى كلِّ إصدارٍ خلال ثوانٍ — أى أنّ الناشرَ
# **لم يكنْ هى قطّ**. فكانت اسماً على بابٍ لا يُفتَح، **وأوهمَ قارئَه أنّ
# النشرَ محروسٌ ههنا وهو ليس كذلك**.
#
# **والناشرُ الحقيقىّ**: تكاملُ Vercel المباشرُ مع المستودع
# (`Connected Git Repository` → `abuelmagd10/code`)، وعلامتُه على كلِّ قيدٍ
# فحصٌ اسمُه `Vercel – code`. يبدأُ بعدَ الدفعِ بثوانٍ — أى **قبلَ أن تنتهىَ
# هذه الوظيفةُ أصلاً**، فلا يمكنُ لهذه أن تكونَ بوّابةً له.
#
# **وأينَ البوّابةُ إذن؟** فى `push_v*.ps1` على جهازِ صاحبِ المشروع: مئةٌ
# وثمانيةُ حرّاسٍ وفخاخُهم الذاتيّةُ وبناءٌ كامل، **ولا يُدفَعُ شىءٌ إن رفضَ
# حارسٌ واحد**. فما يبلغُ `main` مُجازٌ سلفاً، وVercel لا ينشرُ إلّا `main`.
# وتلك بوّابةٌ أقوى من هذه الوظيفة، لأنّها **تصلُ القاعدةَ الحيّة** وهذه لا تصل.
#
# **ولماذا حُذفت لا أُصلِحت؟** لأنّ إصلاحَ `ai-governance-audit` (وهو ما جرى
# فى هذه الدفعة) كان **سيُشغِّلُها لأوّلِ مرّة**. فلو كان `VERCEL_TOKEN`
# مضبوطاً لَنشرت نشراً ثانياً لكلِّ قيدٍ يسابقُ نشرَ التكاملِ المباشر —
# **فيصيرُ للنشرِ بيتان**. وحذفُها هو ما يمنعُ ذلك.
#
# **وما الذى يحرسُ أنّ النشرَ وقعَ فعلاً؟** حادثةُ v3.75.78: ضاعَ حدثُ الدفعِ
# مرّةً واحدة، فبقىَ الإنتاجُ على إصدارٍ سابقٍ **ساعةً كاملةً بلا أن يقولَ
# أحدٌ شيئاً**. فصارَ فى `push_v*.ps1` **رقيبُ نشرٍ** يسألُ Vercel بعدَ الدفعِ:
# هل وُلِدَ نشرٌ لهذا القيدِ بعينِه؟ فإن لم يُولَدْ صرخَ وأعطى خطواتِ الإصلاح.
# ═══════════════════════════════════════════════════════════════════════════
